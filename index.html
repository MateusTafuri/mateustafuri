    <!-- quem é a pessoa por trás do site, para o Google entender a autoria -->

        "@type": "Person",
        "name": "Mateus Tafuri",
        "url": "https://mateustafuri.com.br/",

          "https://www.instagram.com/mateustafuri/",

    <!-- Google Analytics 4, desligado até existir o ID de medição real.
         Para ligar: trocar G-XXXXXXXXXX pelo ID da propriedade (Analytics >
         Administrador > Fluxos de dados) e tirar o comentário daqui.
         O site é uma SPA: o "enhanced measurement" do GA4 já conta as trocas
         de rota pelo History API, então não precisa de código extra.
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      // o dev roda no mesmo HTML: sem isto, cada npm run dev vira visita no relatório
      if (location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
        window.dataLayer = window.dataLayer || [];
        function gtag() {
          dataLayer.push(arguments);
        }
        gtag("js", new Date());
        gtag("config", "G-XXXXXXXXXX");
      }
    </script>
    -->
  </head>
