[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# O site é uma SPA: qualquer rota precisa cair no index.html para o
# React Router assumir. Sem isso, abrir /rifa-solidaria direto dá 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/album/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/carrosseis/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
